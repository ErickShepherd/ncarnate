[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ncarnate-zarr-demo"
version = "0.1.0"
description = "Local, numeric-only verified ncarnate handoff demonstration"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erick Edward Shepherd" }]
requires-python = ">=3.11"
dependencies = ["ncarnate>=2.3,<3", "zarr==3.1.6", "xarray==2026.9.0"]

[project.scripts]
ncarnate-zarr-demo = "ncarnate_zarr_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ncarnate_zarr_demo"]
