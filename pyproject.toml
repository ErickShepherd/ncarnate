[build-system]
# >= 1.27: the first hatchling that understands the PEP 639 SPDX `license`
# expression + `license-files` used below.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ncarnate"
dynamic = ["version"]
description = "Verified, resumable HDF4/HDF-EOS2 conversion and streamed netCDF/HDF5 recompression."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Erick Shepherd", email = "dev@erickshepherd.com" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "netCDF", "netCDF4", "HDF5", "HDF4", "HDF-EOS", "HDF-EOS2",
    "compression", "recompression", "CF conventions", "geolocation",
    "swath", "grid", "MODIS", "AMSR-E", "xarray", "remote sensing",
    "GIS", "atmospheric science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    # These are the supported dependency floors. CI exercises resolved
    # installations across Python/platform combinations, not every possible
    # dependency version. Lowering a floor requires separate validation.
    "netCDF4>=1.6",
    "numpy>=1.26",
    # >= 0.11.6: the first release whose manylinux/macOS wheels bundle
    # libhdf4. Runtime availability still varies by wheel/platform; the
    # capability gate handles missing runtimes. Windows 0.11.7 was tested.
    "pyhdf>=0.11.6",
    "pyproj>=3.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# build + the hatchling backend are test deps so tests/test_sdist_contents.py
# can build a real sdist offline with --no-isolation and assert its contents
# (the F5 distribution-content guard). Keep hatchling in step with the
# build-system floor above.
test = ["pytest", "build>=1.0", "hatchling>=1.27"]
release = ["build>=1.0", "twine", "PyYAML>=6", "cffconvert", "tomli; python_version < '3.11'"]

[project.scripts]
ncarnate = "ncarnate.cli:main"

[project.urls]
Homepage = "https://github.com/ErickShepherd/ncarnate"
Documentation = "https://ncarnate.readthedocs.io/en/stable/"
Source = "https://github.com/ErickShepherd/ncarnate"
Changelog = "https://github.com/ErickShepherd/ncarnate/releases"
Issues = "https://github.com/ErickShepherd/ncarnate/issues"
Citation = "https://doi.org/10.5281/zenodo.21288802"

[tool.hatch.version]
path = "ncarnate/constants.py"

[tool.hatch.build.targets.wheel]
packages = ["ncarnate"]

[tool.hatch.build.targets.sdist]
# The sdist ships the package, the tests + fixtures (so
# `pip install <sdist> && pytest` works), and the fidelity contract; but
# NOT the internal planning/design/checklist/audit docs, which are
# development material, not part of the release.
exclude = [
    # The downstream recipe hashes this sdist. Exclude it to avoid embedding
    # a self-referential source hash and downstream-maintenance prose.
    "conda-recipe",
    "recovery-review",
    "companions",
    "docs/plans",
    "docs/design",
    "docs/owner-checklist-*.md",
    "docs/audits",
    # Root-level loop artifacts are development material like the docs/
    # internals above — the exclusions there do not match a repository-root
    # path, so these must be named explicitly or they ship in the sdist
    # (independent review F5). tests/test_sdist_contents.py asserts they stay
    # out.
    "IMPLEMENTATION_PLAN.md",
    "LOOP_LEARNINGS.md",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "tools/hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Cross-checks against the raw multi-MB granules kept outside the
    # repo; ordinary CI skips them. The manual full-granule workflow verifies
    # every required input first and refuses skipped validation.
    "raw_granules: local-only cross-checks against raw granules",
]
filterwarnings = [
    # netCDF4-python assigns .shape internally, which numpy 2.5
    # deprecates; upstream noise, not ours to fix.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.ruff]
extend-exclude = ["recovery-review"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Permissive: keep ruff's default lint set (pyflakes `F` + the core pycodestyle
# `E4`/`E7`/`E9` groups), which catches real problems -- unused imports,
# undefined names, comparison/statement bugs -- without fighting this
# codebase's deliberate aligned-assignment and blank-line style (E1/E2 spacing
# rules and E501 line length are intentionally NOT enforced).
select = ["E4", "E7", "E9", "F"]
